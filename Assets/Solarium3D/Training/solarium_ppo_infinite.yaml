# Solarium infinite-world fine tuning. Keeps the 194 / [2,2] / LSTM 128 contract.
behaviors:
  Solarium:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 192
      num_layers: 1
      memory:
        memory_size: 128
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 8
    checkpoint_interval: 100000
    max_steps: 12000000
    time_horizon: 256
    summary_freq: 10000
    threaded: true

environment_parameters:
  solarium_difficulty:
    curriculum:
      - name: LearnChunkCrossings
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 125
          threshold: 6.0
        value: 0.0
      - name: StoreAndRecoverRations
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 175
          threshold: 7.0
        value: 0.35
      - name: CrossBiomePressure
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 7.0
        value: 0.7
      - name: PersistentInfiniteSurvival
        value: 1.0
