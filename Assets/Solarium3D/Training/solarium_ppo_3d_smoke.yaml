behaviors:
  Solarium:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 512
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 192
      num_layers: 1
      memory:
        memory_size: 128
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 1
    checkpoint_interval: 512
    max_steps: 1024
    time_horizon: 128
    summary_freq: 256
    threaded: true
