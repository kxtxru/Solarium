# Solarium - ML-Agents 1.1.0 / com.unity.ml-agents 4.0.0
# Behavior name must remain identical to Behavior Parameters in both scenes.
behaviors:
  Solarium:
    trainer_type: ppo
    hyperparameters:
      # 6 arenas x one agent produce enough decorrelated samples for this buffer.
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      # Inputs are already bounded, but running normalization helps mixed vector scales.
      normalize: true
      hidden_units: 192
      # A compact LSTM retains recent danger and resource context across decisions.
      num_layers: 1
      memory:
        memory_size: 128
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 8
    checkpoint_interval: 100000
    # Persistent survival v2 starts from scratch because its actions changed.
    max_steps: 12000000
    time_horizon: 256
    summary_freq: 10000
    threaded: true

# The environment reads this through Academy.EnvironmentParameters.
# Advancement uses smoothed cumulative reward rather than wall-clock time.
# Use the Inspector's manual difficulty toggle to evaluate any earlier stage.
environment_parameters:
  solarium_difficulty:
    curriculum:
      - name: EatEvadeMudAndLava
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 125
          threshold: 6.0
        value: 0.0
      - name: ObstaclesAndPressure
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 7.0
        value: 0.25
      - name: AvoidDanger
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 7.0
        value: 0.5
      - name: ManageRisk
        completion_criteria:
          measure: reward
          behavior: Solarium
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 6.0
        value: 0.75
      - name: ProceduralSurvival
        value: 1.0
